<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>منّا — مراجعة القصص</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
    background: #0b1f16; color: #f2f6f3; min-height: 100vh; padding: 24px;
  }
  .wrap { max-width: 680px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #9db8aa; font-size: 14px; margin-bottom: 24px; }
  .login { display: flex; gap: 8px; margin-bottom: 24px; }
  input[type="password"] {
    flex: 1; padding: 10px 14px; border-radius: 10px; border: 1px solid #2c4a3a;
    background: #12291e; color: #f2f6f3; font-size: 15px;
  }
  button {
    padding: 10px 18px; border-radius: 10px; border: none; cursor: pointer;
    font-size: 14px; font-weight: 600; font-family: inherit;
  }
  .btn-main { background: #1f7a4d; color: #fff; }
  .btn-approve { background: #1f7a4d; color: #fff; flex: 1; }
  .btn-reject { background: #3a1f1f; color: #e8a0a0; border: 1px solid #5c2e2e; flex: 1; }
  .card {
    background: #12291e; border: 1px solid #2c4a3a; border-radius: 14px;
    padding: 18px; margin-bottom: 14px;
  }
  .meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; font-size: 13px; }
  .chip { background: #1a3628; border-radius: 999px; padding: 3px 12px; color: #a8d5bd; }
  .text { font-size: 17px; line-height: 1.7; margin-bottom: 8px; white-space: pre-wrap; word-break: break-word; }
  .byline { color: #7fa38f; font-size: 13px; margin-bottom: 14px; }
  .actions { display: flex; gap: 10px; }
  .empty { text-align: center; color: #7fa38f; padding: 48px 0; font-size: 16px; }
  .error { color: #e8a0a0; margin-bottom: 16px; font-size: 14px; }
  .count { color: #a8d5bd; }
  .hidden { display: none; }
  .refresh { background: transparent; color: #a8d5bd; border: 1px solid #2c4a3a; margin-bottom: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>مراجعة القصص <span id="count" class="count"></span></h1>
  <p class="sub">القصص المعلّقة — وافق عليها لتظهر في الموقع، أو ارفضها لحذفها.</p>

  <div id="login" class="login">
    <input id="token" type="password" placeholder="رمز الإدارة (ADMIN_TOKEN)" />
    <button class="btn-main" onclick="saveToken()">دخول</button>
  </div>

  <div id="panel" class="hidden">
    <button class="refresh" onclick="load()">تحديث ↻</button>
    <div id="error" class="error"></div>
    <div id="list"></div>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id)
  let token = localStorage.getItem('admin_token') || ''

  function headers() {
    return { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }
  }

  function saveToken() {
    token = $('token').value.trim()
    localStorage.setItem('admin_token', token)
    load()
  }

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
  }

  async function load() {
    $('error').textContent = ''
    try {
      const res = await fetch('/api/admin/stories', { headers: headers() })
      if (res.status === 401) {
        localStorage.removeItem('admin_token')
        $('login').classList.remove('hidden')
        $('panel').classList.add('hidden')
        $('error').textContent = ''
        alert('رمز غير صحيح')
        return
      }
      if (!res.ok) throw new Error('HTTP ' + res.status)
      const { stories } = await res.json()
      $('login').classList.add('hidden')
      $('panel').classList.remove('hidden')
      $('count').textContent = stories.length ? '(' + stories.length + ')' : ''
      $('list').innerHTML = stories.length
        ? stories.map(cardHtml).join('')
        : '<div class="empty">لا توجد قصص بانتظار المراجعة ✓</div>'
    } catch (e) {
      $('panel').classList.remove('hidden')
      $('error').textContent = 'تعذر التحميل — تأكد من الاتصال. ' + e.message
    }
  }

  function cardHtml(s) {
    const when = new Date(s.created_at).toLocaleString('ar-SA', { dateStyle: 'medium', timeStyle: 'short' })
    return '<div class="card" id="story-' + s.id + '">'
      + '<div class="meta"><span class="chip">' + esc(s.city) + '</span><span class="chip">' + esc(s.trait) + '</span></div>'
      + '<div class="text">' + esc(s.text) + '</div>'
      + '<div class="byline">' + (s.name ? esc(s.name) + ' · ' : '') + when + '</div>'
      + '<div class="actions">'
      + '<button class="btn-approve" onclick="approve(' + s.id + ')">✓ موافقة</button>'
      + '<button class="btn-reject" onclick="reject(' + s.id + ')">✕ رفض</button>'
      + '</div></div>'
  }

  async function act(id, method, url) {
    $('error').textContent = ''
    const btns = document.querySelectorAll('#story-' + id + ' button')
    btns.forEach((b) => (b.disabled = true))
    try {
      const res = await fetch(url, { method, headers: headers() })
      if (!res.ok) throw new Error('HTTP ' + res.status)
      const el = $('story-' + id)
      el.style.opacity = '0.3'
      setTimeout(() => { el.remove(); load() }, 250)
    } catch (e) {
      btns.forEach((b) => (b.disabled = false))
      $('error').textContent = 'فشلت العملية — حاول مرة أخرى. ' + e.message
    }
  }

  function approve(id) { act(id, 'POST', '/api/admin/stories/' + id + '/approve') }
  function reject(id) {
    if (confirm('رفض وحذف هذه القصة؟')) act(id, 'DELETE', '/api/admin/stories/' + id)
  }

  if (token) load()
</script>
</body>
</html>
